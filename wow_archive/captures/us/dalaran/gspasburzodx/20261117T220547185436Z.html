1528483047503.png"}}}]}},"region":"us"},"region":"us","mythicKeystoneDungeons":{"season":"Midnight Season 2","expansion":"Midnight","dungeons":[{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-large.jpg"},"bossEncounters":[{"description":"This ravenous hydra has survived this cursed place through scavenging the meat of the fallen. That doesn't mean it is not a fearsome combatant, eager to add some fresh temple explorers to its otherwise rotting diet.","id":2878,"location":"Altar of Fangs","name":"Rav'i","slug":"ravi"},{"description":"In the feeding frenzy upon each other, there has been one Child of Ula'tek that has proved victorious over the rest of the brood. With every battle won, the twisting monstrosity known as the Writhing Coil only grows stronger.","id":2879,"location":"Altar of Fangs","name":"The Writhing Coil","slug":"the-writhing-coil"},{"description":"With the Fang of Ula'tek, Zul'jan performs the final ritual to gain the power to release the monstrous weapon his ancestors sealed away thousands of years ago. Still held in the sway of the spirit of Malacrass, Zul'jan is unaware that the Fang is also the only hope for his sister Zul'jarra's survival.","id":2880,"location":"Altar of Fangs","name":"Zul'jan","slug":"zuljan"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Upon the Altar of Fangs, the ancient Amani sealed the vaults of Atal'Utek with the Fang of Ula'tek. Only that cursed dagger has the power to unseal the prison of the great weapon of the Amani. Aid Orweyna and Liadrin in their pursuit of Zul'jan, who has entered this accursed place in a misbegotten attempt to bring lost glory back to the Amani.","expansion":"Midnight","id":1322,"levelMin":1,"location":"Vaults of Atal'Utek","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Altar of Fangs","slug":"altar-of-fangs","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/altar-of-fangs/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-large.jpg"},"bossEncounters":[{"description":"Although an accomplished Magister, Kystia Manaheart was far too devoted to fel magic to give it up entirely. Little wonder she's become a staunch supporter and ally to underground fel smuggling operations in the Row.","id":2679,"location":"Murder Row","name":"Kystia Manaheart","slug":"kystia-manaheart"},{"description":"Clever, quick-witted and commanding, Zaen Bladesorrow oversees the shipments of illegal fel artifacts. Those under his command follow his orders to the letter... or pay the price.","id":2680,"location":"Murder Row","name":"Zaen Bladesorrow","slug":"zaen-bladesorrow"},{"description":"Xathuux the Annihilator is one of Lithiel Cinderfury's most powerful summons. Although he loathes serving the warlock, he follows her commands for the sheer visceral joy of destruction.","id":2681,"location":"Murder Row","name":"Xathuux the Annihilator","slug":"xathuux-the-annihilator"},{"description":"Lithiel Cinderfury sees the Voidstorm above Silvermoon as both threat and opportunity. Her people are afraid, and she has a perfect solution... the power of fel. She claims her smuggling operation protects her people from the dangers above, but the profits she receives are a pleasing bonus.","id":2682,"location":"Murder Row","name":"Lithiel Cinderfury","slug":"lithiel-cinderfury"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The darkened streets of Murder Row hide a secret fel-smuggling operation that has been preying on the fears of Silvermoon's citizens ever since the Voidstorm appeared.","expansion":"Midnight","id":1304,"levelMin":1,"location":"Silvermoon City","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Murder Row","slug":"murder-row","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/murder-row/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-large.jpg"},"bossEncounters":[{"description":"Driven by voracious greed, the gluttonous Hoardmonger fiercely defends the stashes of food and supplies he has stolen from nearby troll tribes. Nalorakk's first trial is to eliminate him before the tribes go hungry.","id":2776,"location":"Den of Nalorakk","name":"The Hoardmonger","slug":"the-hoardmonger"},{"description":"The seasons can be kind or cruel. Sentinel of Winter unleashes the harshest of winter storms to test all who face him. To surpass Nalorakk's second trial, endure the biting cold and defeat the embodiment of a winter storm.","id":2777,"location":"Den of Nalorakk","name":"Sentinel of Winter","slug":"sentinel-of-winter"},{"description":"Slumbering in his fitful and battle-filled dream, Nalorakk, the Loa of War, will only test the mettle of the worthy. Survive his trial and receive his blessing or die trying.","id":2778,"location":"Den of Nalorakk","name":"Nalorakk","slug":"nalorakk"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Wounded by Zul'jin and Malacrass, Nalorakk turned his back on the Amani, slumbering in his den to ease his pain. Now, the Amani seek to heal the rift between their tribe and the loa. But, to gain Nalorakk's favor, those who come before him must complete his trials. Assist Zul'jarra as she journeys into the mind of the Loa of War to defeat him and gain his blessing.","expansion":"Midnight","id":1311,"levelMin":1,"location":"Zul'Aman","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Den of Nalorakk","slug":"den-of-nalorakk","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/den-of-nalorakk/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/voidscar-arena-large.jpg"},"bossEncounters":[{"description":"The domanaar's prized champion, Taz'Rah, is forced to fight against his will. Taz'Rah demands his own death from every opponent, hoping each battle will finally end his suffering.","id":2791,"location":"Voidscar Arena","name":"Taz'Rah","slug":"tazrah"},{"description":"Imprisoned by Charonus, this starving behemoth is hoping for a new victim to sate his appetite. Atroxus's sheer size is almost as dangerous as the poison he spews.","id":2792,"location":"Voidscar Arena","name":"Atroxus","slug":"atroxus"},{"description":"The overly confident and ostentatious owner of the Voidscar Arena, Charonus, is impressed by the fighting ability of Azerothians and demands them for his grand collection.","id":2793,"location":"Voidscar Arena","name":"Charonus","slug":"charonus"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Voidscar Arena awaits worthy challengers! Overseer Charonus has filled the arena with opponents plucked from across Azeroth, forcing them to participate in his games.","expansion":"Midnight","id":1313,"levelMin":1,"location":"Voidstorm","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Voidscar Arena","slug":"voidscar-arena","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/voidscar-arena-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/voidscar-arena/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-large.jpg"},"bossEncounters":[{"description":"The Lightbloom has suffered a terrible defeat, but like the rutaani it imbues, it changes. These Lightblossomed rutaani fanatically propagate their vicious and invasive garden.","id":2769,"location":"The Blinding Vale","name":"Lightblossom Trinity","slug":"lightblossom-trinity"},{"description":"Ikuzz is a fearsome carnivore who once stalked prey throughout Harandar. Now the Light Hunter has succumbed to the overwhelming power of the Lightbloom, and his insatiable hunger serves its growth.","id":2770,"location":"The Blinding Vale","name":"Ikuzz the Light Hunter","slug":"ikuzz-the-light-hunter"},{"description":"The once-respected Rootwarden Ruia could not defeat the Lightbloom on his own. His wounded pride led him to drawing power from the Lightbloom and using it to punish all others instead of aiding his allies.","id":2771,"location":"The Blinding Vale","name":"Lightwarden Ruia","slug":"lightwarden-ruia"},{"description":"Born from the Lightbloom's epicenter, Ziekket was spawned and incubated by Light-infested rutaani to create an unstoppable engine of the Lightbloom's expansion.","id":2772,"location":"The Blinding Vale","name":"Ziekket","slug":"ziekket"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Blinding Vale sprouted instantly. From within the Lightbloom, rutaani emerged and spread the Lightbloom in their wake.\r\nAfter the Lightbloom's defeat in Eversong, Orweyna began surgical strikes to keep the Lightbloom in check. But the hideous glare of the Blinding Vale hides a garden where the Lightbloom cultivates new creatures and magic to drive forward their one fanatical imperative. Growth unstoppable.","expansion":"Midnight","id":1309,"levelMin":1,"location":"Harandar","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"The Blinding Vale","slug":"the-blinding-vale","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/the-blinding-vale/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-large.jpg"},"bossEncounters":[{"description":"Melidrussa Chillworn leads the Primalist infusion efforts in the Ruby Life Pools. Her fervent belief is that she is protecting young dragon eggs from the influence of the titans and cleansing them from the stain of Order magic. She will stop at nothing to fulfill her calling and return the eggs to what she believes is their natural state.","id":2488,"location":"Ruby Life Pools","name":"Melidrussa Chillworn","slug":"melidrussa-chillworn"},{"description":"As Primalist forces assault the Ruby Life Pools from all sides, it falls to Kokia and her Blazebound lieutenants to capture precious eggs from overwhelmed defenders, all while spreading flame and havoc as they go.","id":2485,"location":"Ruby Life Pools","name":"Kokia Blazehoof","slug":"kokia-blazehoof"},{"description":"Kyrakka and Erkhart roam the skies above the Ruby Life Pools coordinating attacks on the shrine below, while also taking out any interfering dragons. If left unchecked, they will burn the Life Pools to the ground and blow the remaining ash away in a cleansing elemental storm.","id":2503,"location":"Ruby Life Pools","name":"Kyrakka and Erkhart Stormvein","slug":"kyrakka-and-erkhart-stormvein"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"As the ancestral nesting grounds for the five flights, the Ruby Life Pools is a sacred place. The Red Dragonflight, whose charge it is to nuture all life, protect these pools and the the future of all dragonkind held within them.\r\n\r\nHowever, Raszageth and her Primalists have come to steal that future away and infuse their own powers into the sacred pools. They must be stopped for dragonkind to thrive.","expansion":"Dragonflight","id":1202,"levelMin":1,"location":"The Waking Shores","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Ruby Life Pools","slug":"ruby-life-pools","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/ruby-life-pools/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-large.jpg"},"bossEncounters":[{"description":"A pair of powerful sethrak that are blessed by the storm and charged with guarding the temple's entrance.","id":2142,"location":"Temple of Sethraliss","name":"Adderis and Aspix","slug":"adderis-and-aspix"},{"description":"Merektha is the product of foul experiments to produce an army of unstoppable beasts. With her clutch of eggs beginning to hatch, this mother is on the hunt for victims to serve as food for her ravenous children.","id":2143,"location":"Temple of Sethraliss","name":"Merektha","slug":"merektha"},{"description":"With the corruption of her temple, Sethraliss' command of lightning has created twisted elementals that roam the sunken chambers. Formed by this aberrant energy, Galvazzt seeks to grow in power by any means.","id":2144,"location":"Temple of Sethraliss","name":"Galvazzt","slug":"galvazzt"},{"description":"The Heart of Sethraliss is in the grips of a terrible power that seeks to corrupt her. Her avatar must be restored before this evil takes root and she is reborn as a dark loa capable of destroying the whole of Vol'dun.","id":2145,"location":"Temple of Sethraliss","name":"Avatar of Sethraliss","slug":"avatar-of-sethraliss"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Centuries ago, Sethraliss, a powerful snake loa, sacrificed herself to stop Mythrax from unleashing his master upon Azeroth. After the battle, her devoted followers transported her remains and built a temple around them while they awaited her rebirth. Now, a dark force stirs within this sacred temple that seeks to twist her power towards nefarious ends.","expansion":"Battle for Azeroth","id":1030,"levelMin":1,"location":"Vol'dun","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Temple of Sethraliss","slug":"temple-of-sethraliss","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/temple-of-sethraliss/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/kings-rest-large.jpg"},"bossEncounters":[{"description":"Kings' Rest has come under attack before. After a foolish troll tried to summon Hakkar the Soulflayer to this island many millennia ago, the priests of Zandalar created a mighty construct to defend this tomb. The Golden Serpent has stood against intruders ever since, judging who is worthy to enter these sacred halls.","id":2165,"location":"Kings' Rest","name":"The Golden Serpent","slug":"the-golden-serpent"},{"description":"There was once a caste of Zandalari whose purpose was to preserve and defend the remains of past rulers. But when a terrible plague of corrupted blood tore through the empire, it was too risky for mortals to handle the dead. Golems were summoned for the grim work of preservation and burial; they have been used ever since.","id":2171,"location":"Kings' Rest","name":"Mchimba the Embalmer","slug":"mchimba-the-embalmer"},{"description":"There was once a time when no single emperor could rule Zandalar. After a period of civil war, the heads of three families formed an uneasy coalition and tried to rule the empire together. Though they did not often agree, there was peace in Zandalar. Briefly.","id":2170,"location":"Kings' Rest","name":"The Council of Tribes","slug":"the-council-of-tribes"},{"description":"Dazar. The founder and first King of Zandalar, who led an exodus of his people out of the muck and mire and built a city of gold. The first tamer of raptors. The warrior undefeated. The father of a kingdom.\r\n\r\nHis eternal repose cut short by Zul's dark magic, it lies to you to once again put him to rest.","id":2172,"location":"Kings' Rest","name":"Dazar, The First King","slug":"dazar-the-first-king"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Few places in Zandalar are more sacred than Kings' Rest. Every king, conqueror, or tyrant who has held control of the Zandalari empire is housed within this great city of the dead to protect and honor not only their bodies, but also their spirits.\r\n\r\nEntry has historically been restricted solely to the Zandalari priesthood and royalty, but as Zul's dark magic winds its way through the tomb you must venture inside and put an end to the darkness that has found purchase there.","expansion":"Battle for Azeroth","id":1041,"levelMin":1,"location":"Zuldazar","modes":["HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Kings' Rest","slug":"kings-rest","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/kings-rest-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/kings-rest/details.frag"}}]}},"supportedArmoryTabs":["character","achievements","collections","uncollected","battlepets","dungeons","raids","pvp","ratings","reputation"]};

fwarcraft.com/us/icons/56/5934896.jpg"},"id":140726,"name":"Dryad's Dance","rank":1},{"cast":"Passive","description":"Force of Nature cooldown reduced by 15 sec.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/306845.jpg"},"id":122907,"name":"Early Spring","rank":1},{"cast":"Passive","description":"Time elapsed while your major abilities are available to be used or at maximum charges is subtracted from that ability's cooldown after the next time you use it, up to 15 seconds.\r\n\r\nAffects Force of Nature, Incarnation: Chosen of Elune, and Convoke the Spirits.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/5177651.jpg"},"id":122906,"name":"Control of the Dream","rank":1},{"cast":"Passive","description":"Every 5 Regrowths you cast makes your next Wrath, Starfire, or Entangling Roots instant and increases damage it deals by 100%.\r\n\r\nEvery 5 Starsurges or Starfalls you cast makes your next Regrowth or Entangling roots instant.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/136104.jpg"},"id":122208,"name":"Blooming Infusion","rank":1},{"cast":"Passive","description":"Your Starfall damage is increased by 18% and your Starsurge damage is increased by 8%.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/132137.jpg"},"id":140725,"name":"Spirit of the Thicket","rank":1},{"cast":"Passive","description":"Each of your Force of Nature treants increases damage your spells deal by 4% while active.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/132129.jpg"},"id":122215,"name":"Harmony of the Grove","rank":1}],"specTalents":[{"cast":"Passive","description":"You may draw the sun and moon into alignment for 15 sec, empowering either your Nature or Arcane spells. Casting Wrath or Starfire changes what mode of Eclipse will be entered, and the two modes of Eclipse share a button and 32 sec cooldown.\r\n\r\n Eclipse (Solar)\r\nNature spells deal 15% additional damage and Wrath damage is increased by 40%.\r\n\ y 2 sec.\r\n\r\nWhile out of combat your Astral Power rebalances to 50 instead of depleting to empty.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/132113.jpg"},"id":114867,"name":"Nature's Balance","rank":1},{"cast":"Passive","description":"Casting Starfall extends the duration of active Moonfires and Sunfires by 3.0 sec, up to 28 sec.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/236168.jpg"},"id":114848,"name":"Aetherial Kindling","rank":1},{"cast":"Passive","description":"Your Wrath and Starfire chance to critically strike is increased by 10% and they generate 2 additional Astral Power.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/1029587.jpg"},"id":114841,"name":"Wild Surges","rank":1},{"cast":"Passive","description":"Celestial bodies align, maintaining both Eclipses and granting 16% haste for 15 sec.","id":114854,"name":"Celestial Alignment","rank":1},{"cast":"Passive","description":"Sunfire damage has a chance to grow a magical mushroom at a target's location. After 1 sec, the mushroom detonates, dealing 15,057 Nature damage and then an additional 8,495 Nature damage over 10 sec. Affected targets are slowed by 50%.\r\n\r\nGenerates up to 20 Astral Power based on targets hit.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/464342.jpg"},"id":114839,"name":"Sunseeker Mushroom","rank":1},{"cast":"Passive","description":"Starsurge increases the damage the target takes from your periodic effects and Shooting Stars by 16% for 5 sec. Reapplying this effect extends its duration, up to 20 sec. Limit 1.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/135731.jpg"},"id":114851,"name":"Stellar Amplification","rank":1},{"cast":"Passive","description":"Incarnation: Chosen of Elune's cooldown is reduced by 60 seconds and it has two charges.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/1033477.jpg"},"id":114861,"name":"Whirling Stars","rank":1},{"cast":"Passive","description":"Casting Wrath has a 12% chance to make your next Starsurge or Starfall free.\r\n\r\nCasting Starfire has a 15% chance to make your next Starsurge or Starfall free.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/1120185.jpg"},"id":114862,"name":"Touch the Cosmos","rank":1},{"cast":"Passive","description":"Your Moonfire and Sunfire deal damage 25% more frequently, also increasing the rate that Shooting Stars fall.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/538516.jpg"},"id":114868,"name":"Cosmic Rapidity","rank":2},{"cast":"Passive","description":"Moonfire, Sunfire, and Shooting Stars damage increased by 10%.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/236216.jpg"},"id":133038,"name":"Celestial Fire","rank":1},{"cast":"Passive","description":"Casting a free Starsurge or Starfall grants Solstice for 3 sec.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/236168.jpg"},"id":133037,"name":"Hail of Stars","rank":1},{"cast":"Passive","description":"Starsurge and Starfall grant you 8% Haste for 20 sec or until you enter a new Eclipse.\r\n\r\nStacks up to 3 times. Gaining a stack does not refresh the duration.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/462651.jpg"},"id":114845,"name":"Starlord","rank":2},{"cast":"Passive","description":"Entering Eclipse increases your critical strike chance with Arcane or Nature spells by 20%, decreasing by 2% every 1 sec.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/236150.jpg"},"id":114853,"name":"Balance of All Things","rank":2},{"cast":"Passive","description":"Entering any Eclipse has a 60% chance to grant the benefits of both Lunar and Solar Eclipse.","icon":{"url":"https://render.worldofwarcraft.com/us/icons/56/7439196.jpg"},"id":114837,"name":"Total Eclipse","rank":2},{"cast":"Passive","description":"Starsurge has a 20% chance to make Starfall free. Starfall has a 40% chance to make Starsurge free.","icon":{"url":"https://render.wo on":"Altar of Fangs","name":"The Writhing Coil","slug":"the-writhing-coil"},{"description":"With the Fang of Ula'tek, Zul'jan performs the final ritual to gain the power to release the monstrous weapon his ancestors sealed away thousands of years ago. Still held in the sway of the spirit of Malacrass, Zul'jan is unaware that the Fang is also the only hope for his sister Zul'jarra's survival.","id":2880,"location":"Altar of Fangs","name":"Zul'jan","slug":"zuljan"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Upon the Altar of Fangs, the ancient Amani sealed the vaults of Atal'Utek with the Fang of Ula'tek. Only that cursed dagger has the power to unseal the prison of the great weapon of the Amani. Aid Orweyna and Liadrin in their pursuit of Zul'jan, who has entered this accursed place in a misbegotten attempt to bring lost glory back to the Amani.","expansion":"Midnight","id":1322,"levelMin":1,"location":"Vaults of Atal'Utek","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Altar of Fangs","slug":"altar-of-fangs","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/altar-of-fangs/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-large.jpg"},"bossEncounters":[{"description":"Although an accomplished Magister, Kystia Manaheart was far too devoted to fel magic to give it up entirely. Little wonder she's become a staunch supporter and ally to underground fel smuggling operations in the Row.","id":2679,"location":"Murder Row","name":"Kystia Manaheart","slug":"kystia-manaheart"},{"description":"Clever, quick-witted and commanding, Zaen Bladesorrow oversees the shipments of illegal fel artifacts. Those under his command follow his orders to the letter... or pay the price.","id":2680,"location":"Murder Row","name":"Zaen Bladesorrow","slug":"zaen-bladesorrow"},{"description":"Xathuux the Annihilator is one of Lithiel Cinderfury's most powerful summons. Although he loathes serving the warlock, he follows her commands for the sheer visceral joy of destruction.","id":2681,"location":"Murder Row","name":"Xathuux the Annihilator","slug":"xathuux-the-annihilator"},{"description":"Lithiel Cinderfury sees the Voidstorm above Silvermoon as both threat and opportunity. Her people are afraid, and she has a perfect solution... the power of fel. She claims her smuggling operation protects her people from the dangers above, but the profits she receives are a pleasing bonus.","id":2682,"location":"Murder Row","name":"Lithiel Cinderfury","slug":"lithiel-cinderfury"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The darkened streets of Murder Row hide a secret fel-smuggling operation that has been preying on the fears of Silvermoon's citizens ever since the Voidstorm appeared.","expansion":"Midnight","id":1304,"levelMin":1,"location":"Silvermoon City","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Murder Row","slug":"murder-row","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/murder-row/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-large.jpg"},"bossEncounters":[{"description":"Driven by voracious greed, the gluttonous Hoardmonger fiercely defends the stashes of food and supplies he has stolen from nearby troll tribes. Nalorakk's first trial is to eliminate him before the tribes go hungry.","id":2776,"location":"Den of Nalorakk","name":"The Hoardmonger","slug":"the-hoardmonger"},{"description":"The seasons can be kind or cruel. Sentinel of Winter unleashes the harshest of winter storms to test all who face him. To surpass Nalorakk's second trial, endure the biting cold and defeat the embodiment of a winter storm.","id":2777,"location":"Den of Nalorakk","name":"Sentinel of Winter","slug":"sentinel-of-winter"},{"description":"Slumbering in his fitful and battle-filled dream, Nalorakk, the Loa of War, will only test the mettle of the worthy. Survive his trial and receive his blessing or die trying.","id":2778,"location":"Den of Nalorakk","name":"Nalorakk","slug":"nalorakk"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Wounded by Zul'jin and Malacrass, Nalorakk turned his back on the Amani, slumbering in his den to ease his pain. Now, the Amani seek to heal the rift between their tribe and the loa. But, to gain Nalorakk's favor, those who come before him must complete his trials. Assist Zul'jarra as she journeys into the mind of the Loa of War to defeat him and gain his blessing.","expansion":"Midnight","id":1311,"levelMin":1,"location":"Zul'Aman","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Den of Nalorakk","slug":"den-of-nalorakk","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/den-of-nalorakk/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/voidscar-arena-large.jpg"},"bossEncounters":[{"description":"The domanaar's prized champion, Taz'Rah, is forced to fight against his will. Taz'Rah demands his own death from every opponent, hoping each battle will finally end his suffering.","id":2791,"location":"Voidscar Arena","name":"Taz'Rah","slug":"tazrah"},{"description":"Imprisoned by Charonus, this starving behemoth is hoping for a new victim to sate his appetite. Atroxus's sheer size is almost as dangerous as the poison he spews.","id":2792,"location":"Voidscar Arena","name":"Atroxus","slug":"atroxus"},{"description":"The overly confident and ostentatious owner of the Voidscar Arena, Charonus, is impressed by the fighting ability of Azerothians and demands them for his grand collection.","id":2793,"location":"Voidscar Arena","name":"Charonus","slug":"charonus"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Voidscar Arena awaits worthy challengers! Overseer Charonus has filled the arena with opponents plucked from across Azeroth, forcing them to participate in his games.","expansion":"Midnight","id":1313,"levelMin":1,"location":"Voidstorm","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Voidscar Arena","slug":"voidscar-arena","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/voidscar-arena-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/voidscar-arena/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-large.jpg"},"bossEncounters":[{"description":"The Lightbloom has suffered a terrible defeat, but like the rutaani it imbues, it changes. These Lightblossomed rutaani fanatically propagate their vicious and invasive garden.","id":2769,"location":"The Blinding Vale","name":"Lightblossom Trinity","slug":"lightblossom-trinity"},{"description":"Ikuzz is a fearsome carnivore who once stalked prey throughout Harandar. Now the Light Hunter has succumbed to the overwhelming power of the Lightbloom, and his insatiable hunger serves its growth.","id":2770,"location":"The Blinding Vale","name":"Ikuzz the Light Hunter","slug":"ikuzz-the-light-hunter"},{"description":"The once-respected Rootwarden Ruia could not defeat the Lightbloom on his own. His wounded pride led him to drawing power from the Lightbloom and using it to punish all others instead of aiding his allies.","id":2771,"location":"The Blinding Vale","name":"Lightwarden Ruia","slug":"lightwarden-ruia"},{"description":"Born from the Lightbloom's epicenter, Ziekket was spawned and incubated by Light-infested rutaani to create an unstoppable engine of the Lightbloom's expansion.","id":2772,"location":"The Blinding Vale","name":"Ziekket","slug":"ziekket"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Blinding Vale sprouted instantly. From within the Lightbloom, rutaani emerged and spread the Lightbloom in their wake.\r\nAfter the Lightbloom's defeat in Eversong, Orweyna began surgical strikes to keep the Lightbloom in check. But the hideous glare of the Blinding Vale hides a garden where the Lightbloom cultivates new creatures and magic to drive forward their one fanatical imperative. Growth unstoppable.","expansion":"Midnight","id":1309,"levelMin":1,"location":"Harandar","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"The Blinding Vale","slug":"the-blinding-vale","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/the-blinding-vale/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-large.jpg"},"bossEncounters":[{"description":"Melidrussa Chillworn leads the Primalist infusion efforts in the Ruby Life Pools. Her fervent belief is that she is protecting young dragon eggs from the influence of the titans and cleansing them from the stain of Order magic. She will stop at nothing to fulfill her calling and return the eggs to what she believes is their natural state.","id":2488,"location":"Ruby Life Pools","name":"Melidrussa Chillworn","slug":"melidrussa-chillworn"},{"description":"As Primalist forces assault the Ruby Life Pools from all sides, it falls to Kokia and her Blazebound lieutenants to capture precious eggs from overwhelmed defenders, all while spreading flame and havoc as they go.","id":2485,"location":"Ruby Life Pools","name":"Kokia Blazehoof","slug":"kokia-blazehoof"},{"description":"Kyrakka and Erkhart roam the skies above the Ruby Life Pools coordinating attacks on the shrine below, while also taking out any interfering dragons. If left unchecked, they will burn the Life Pools to the ground and blow the remaining ash away in a cleansing elemental storm.","id":2503,"location":"Ruby Life Pools","name":"Kyrakka and Erkhart Stormvein","slug":"kyrakka-and-erkhart-stormvein"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"As the ancestral nesting grounds for the five flights, the Ruby Life Pools is a sacred place. The Red Dragonflight, whose charge it is to nuture all life, protect these pools and the the future of all dragonkind held within them.\r\n\r\nHowever, Raszageth and her Primalists have come to steal that future away and infuse their own powers into the sacred pools. They must be stopped for dragonkind to thrive.","expansion":"Dragonflight","id":1202,"levelMin":1,"location":"The Waking Shores","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Ruby Life Pools","slug":"ruby-life-pools","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/ruby-life-pools/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-large.jpg"},"bossEncounters":[{"description":"A pair of powerful sethrak that are blessed by the storm and charged with guarding the temple's entrance.","id":2142,"location":"Temple of Sethraliss","name":"Adderis and Aspix","slug":"adderis-and-aspix"},{"description":"Merektha is the product of foul experiments to produce an army of unstoppable beasts. With her clutch of eggs beginning to hatch, this mother is on the hunt for victims to serve as food for her ravenous children.","id":2143,"location":"Temple of Sethraliss","name":"Merektha","slug":"merektha"},{"description":"With the corruption of her temple, Sethraliss' command of lightning has created twisted elementals that roam the sunken chambers. Formed by this aberrant energy, Galvazzt seeks to grow in power by any means.","id":2144,"location":"Temple of Sethraliss","name":"Galvazzt","slug":"galvazzt"},{"description":"The Heart of Sethraliss is in the grips of a terrible power that seeks to corrupt her. Her avatar must be restored before this evil takes root and she is reborn as a dark loa capable of destroying the whole of Vol'dun.","id":2145,"location":"Temple of Sethraliss","name":"Avatar of Sethraliss","slug":"avatar-of-sethraliss"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Centuries ago, Sethraliss, a powerful snake loa, sacrificed herself to stop Mythrax from unleashing his master upon Azeroth. After the battle, her devoted followers transported her remains and built a temple around them while they awaited her rebirth. Now, a dark force stirs within this sacred temple that seeks to twist her power towards nefarious ends.","expansion":"Battle for Azeroth","id":1030,"levelMin":1,"location":"Vol'dun","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Temple of Sethraliss","slug":"temple-of-sethraliss","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/temple-of-sethraliss/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/kings-rest-large.jpg"},"bossEncounters":[{"description":"Kings' Rest has come under attack before. After a foolish troll tried to summon Hakkar the Soulflayer to this island many millennia ago, the priests of Zandalar created a mighty construct to defend this tomb. The Golden Serpent has stood against intruders ever since, judging who is worthy to enter these sacred halls.","id":2165,"location":"Kings' Rest","name":"The Golden Serpent","slug":"the-golden-serpent"},{"description":"There was once a caste of Zandalari whose purpose was to preserve and defend the remains of past rulers. But when a terrible plague of corrupted blood tore through the empire, it was too risky for mortals to handle the dead. Golems were summoned for the grim work of preservation and burial; they have been used ever since.","id":2171,"location":"Kings' Rest","name":"Mchimba the Embalmer","slug":"mchimba-the-embalmer"},{"description":"There was once a time when no single emperor could rule Zandalar. After a period of civil war, the heads of three families formed an uneasy coalition and tried to rule the empire together. Though they did not often agree, there was peace in Zandalar. Briefly.","id":2170,"location":"Kings' Rest","name":"The Council of Tribes","slug":"the-council-of-tribes"},{"description":"Dazar. The founder and first King of Zandalar, who led an exodus of his people out of the muck and mire and built a city of gold. The first tamer of raptors. The warrior undefeated. The father of a kingdom.\r\n\r\nHis eternal repose cut short by Zul's dark magic, it lies to you to once again put him to rest.","id":2172,"location":"Kings' Rest","name":"Dazar, The First King","slug":"dazar-the-first-king"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Few places in Zandalar are more sacred than Kings' Rest. Every king, conqueror, or tyrant who has held control of the Zandalari empire is housed within this great city of the dead to protect and honor not only their bodies, but also their spirits.\r\n\r\nEntry has historically been restricted solely to the Zandalari priesthood and royalty, but as Zul's dark magic winds its way through the tomb you must venture inside and put an end to the darkness that has found purchase there.","expansion":"Battle for Azeroth","id":1041,"levelMin":1,"location":"Zuldazar","modes":["HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Kings' Rest","slug":"kings-rest","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/kings-rest-small.jpg"},"url":"/character/us/dalaran/gspasburzodx/pve/mythic/kings-rest/details.frag"}}]}},"supportedArmoryTabs":["character","achievements","collections","uncollected","battlepets","dungeons","raids","pvp","ratings","reputation"]},"variableName":"characterProfileInitialState"}]};</script><script id="settings">settings = {"x-powered-by":false,"etag":"weak","env":"production","query parser":"extended","subdomain offset":2,"trust proxy":true,"views":"/usr/src/app/templates","jsonp callback name":"callback","view cache":true,"view engine":"pug"};</script></body></html>
