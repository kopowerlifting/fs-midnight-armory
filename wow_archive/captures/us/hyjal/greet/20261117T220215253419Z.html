al","slug":"hyjal"},"region":"us","slug":"jordinii","spec":{"id":62,"name":"Arcane","enum":"ARCANE","role":{"id":3,"name":"Damage","enum":"DAMAGE","slug":"damage"},"slug":"arcane"},"url":"/en-us/character/us/hyjal/Jordinii"},{"avatar":{"url":"https://render.worldofwarcraft.com/us/character/hyjal/218/135723226-avatar.jpg"},"averageItemLevel":288,"class":{"id":4,"name":"Rogue","enum":"ROGUE","slug":"rogue"},"name":"Dwarvensneak","race":{"id":10,"name":"Blood Elf","enum":"BLOODELF","slug":"blood-elf"},"realm":{"name":"Hyjal","slug":"hyjal"},"region":"us","slug":"dwarvensneak","spec":{"id":261,"name":"Subtlety","enum":"SUBTLETY","role":{"id":3,"name":"Damage","enum":"DAMAGE","slug":"damage"},"slug":"subtlety"},"url":"/en-us/character/us/hyjal/Dwarvensneak"}],"qualifyingDuration":1800000,"withinTime":true,"time":"00:29:31","id":"voidscar-arena-mythic-dungeon"},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-large.jpg"},"bossEncounters":[{"description":"This ravenous hydra has survived this cursed place through scavenging the meat of the fallen. That doesn't mean it is not a fearsome combatant, eager to add some fresh temple explorers to its otherwise rotting diet.","id":2878,"location":"Altar of Fangs","name":"Rav'i","slug":"ravi"},{"description":"In the feeding frenzy upon each other, there has been one Child of Ula'tek that has proved victorious over the rest of the brood. With every battle won, the twisting monstrosity known as the Writhing Coil only grows stronger.","id":2879,"location":"Altar of Fangs","name":"The Writhing Coil","slug":"the-writhing-coil"},{"description":"With the Fang of Ula'tek, Zul'jan performs the final ritual to gain the power to release the monstrous weapon his ancestors sealed away thousands of years ago. Still held in the sway of the spirit of Malacrass, Zul'jan is unaware that the Fang is also the only hope for his sister Zul'jarra's survival.","id":2880,"location":"Altar of Fangs","name":"Zul'jan","slug":"zuljan"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Upon the Altar of Fangs, the ancient Amani sealed the vaults of Atal'Utek with the Fang of Ula'tek. Only that cursed dagger has the power to unseal the prison of the great weapon of the Amani. Aid Orweyna and Liadrin in their pursuit of Zul'jan, who has entered this accursed place in a misbegotten attempt to bring lost glory back to the Amani.","expansion":"Midnight","id":1322,"levelMin":1,"location":"Vaults of Atal'Utek","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Altar of Fangs","slug":"altar-of-fangs","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/altar-of-fangs/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-large.jpg"},"bossEncounters":[{"description":"Although an accomplished Magister, Kystia Manaheart was far too devoted to fel magic to give it up entirely. Little wonder she's become a staunch supporter and ally to underground fel smuggling operations in the Row.","id":2679,"location":"Murder Row","name":"Kystia Manaheart","slug":"kystia-manaheart"},{"description":"Clever, quick-witted and commanding, Zaen Bladesorrow oversees the shipments of illegal fel artifacts. Those under his command follow his orders to the letter... or pay the price.","id":2680,"location":"Murder Row","name":"Zaen Bladesorrow","slug":"zaen-bladesorrow"},{"description":"Xathuux the Annihilator is one of Lithiel Cinderfury's most powerful summons. Although he loathes serving the warlock, he follows her commands for the sheer visceral joy of destruction.","id":2681,"location":"Murder Row","name":"Xathuux the Annihilator","slug":"xathuux-the-annihilator"},{"description":"Lithiel Cinderfury sees the Voidstorm above Silvermoon as both threat and opportunity. Her people are afraid, and she has a perfect solution... the power of fel. She claims her smuggling operation protects her people from the dangers above, but the profits she receives are a pleasing bonus.","id":2682,"location":"Murder Row","name":"Lithiel Cinderfury","slug":"lithiel-cinderfury"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The darkened streets of Murder Row hide a secret fel-smuggling operation that has been preying on the fears of Silvermoon's citizens ever since the Voidstorm appeared.","expansion":"Midnight","id":1304,"levelMin":1,"location":"Silvermoon City","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Murder Row","slug":"murder-row","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/murder-row/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-large.jpg"},"bossEncounters":[{"description":"Driven by voracious greed, the gluttonous Hoardmonger fiercely defends the stashes of food and supplies he has stolen from nearby troll tribes. Nalorakk's first trial is to eliminate him before the tribes go hungry.","id":2776,"location":"Den of Nalorakk","name":"The Hoardmonger","slug":"the-hoardmonger"},{"description":"The seasons can be kind or cruel. Sentinel of Winter unleashes the harshest of winter storms to test all who face him. To surpass Nalorakk's second trial, endure the biting cold and defeat the embodiment of a winter storm.","id":2777,"location":"Den of Nalorakk","name":"Sentinel of Winter","slug":"sentinel-of-winter"},{"description":"Slumbering in his fitful and battle-filled dream, Nalorakk, the Loa of War, will only test the mettle of the worthy. Survive his trial and receive his blessing or die trying.","id":2778,"location":"Den of Nalorakk","name":"Nalorakk","slug":"nalorakk"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Wounded by Zul'jin and Malacrass, Nalorakk turned his back on the Amani, slumbering in his den to ease his pain. Now, the Amani seek to heal the rift between their tribe and the loa. But, to gain Nalorakk's favor, those who come before him must complete his trials. Assist Zul'jarra as she journeys into the mind of the Loa of War to defeat him and gain his blessing.","expansion":"Midnight","id":1311,"levelMin":1,"location":"Zul'Aman","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Den of Nalorakk","slug":"den-of-nalorakk","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/den-of-nalorakk/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-large.jpg"},"bossEncounters":[{"description":"The Lightbloom has suffered a terrible defeat, but like the rutaani it imbues, it changes. These Lightblossomed rutaani fanatically propagate their vicious and invasive garden.","id":2769,"location":"The Blinding Vale","name":"Lightblossom Trinity","slug":"lightblossom-trinity"},{"description":"Ikuzz is a fearsome carnivore who once stalked prey throughout Harandar. Now the Light Hunter has succumbed to the overwhelming power of the Lightbloom, and his insatiable hunger serves its growth.","id":2770,"location":"The Blinding Vale","name":"Ikuzz the Light Hunter","slug":"ikuzz-the-light-hunter"},{"description":"The once-respected Rootwarden Ruia could not defeat the Lightbloom on his own. His wounded pride led him to drawing power from the Lightbloom and using it to punish all others instead of aiding his allies.","id":2771,"location":"The Blinding Vale","name":"Lightwarden Ruia","slug":"lightwarden-ruia"},{"description":"Born from the Lightbloom's epicenter, Ziekket was spawned and incubated by Light-infested rutaani to create an unstoppable engine of the Lightbloom's expansion.","id":2772,"location":"The Blinding Vale","name":"Ziekket","slug":"ziekket"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Blinding Vale sprouted instantly. From within the Lightbloom, rutaani emerged and spread the Lightbloom in their wake.\r\nAfter the Lightbloom's defeat in Eversong, Orweyna began surgical strikes to keep the Lightbloom in check. But the hideous glare of the Blinding Vale hides a garden where the Lightbloom cultivates new creatures and magic to drive forward their one fanatical imperative. Growth unstoppable.","expansion":"Midnight","id":1309,"levelMin":1,"location":"Harandar","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"The Blinding Vale","slug":"the-blinding-vale","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/the-blinding-vale/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-large.jpg"},"bossEncounters":[{"description":"Melidrussa Chillworn leads the Primalist infusion efforts in the Ruby Life Pools. Her fervent belief is that she is protecting young dragon eggs from the influence of the titans and cleansing them from the stain of Order magic. She will stop at nothing to fulfill her calling and return the eggs to what she believes is their natural state.","id":2488,"location":"Ruby Life Pools","name":"Melidrussa Chillworn","slug":"melidrussa-chillworn"},{"description":"As Primalist forces assault the Ruby Life Pools from all sides, it falls to Kokia and her Blazebound lieutenants to capture precious eggs from overwhelmed defenders, all while spreading flame and havoc as they go.","id":2485,"location":"Ruby Life Pools","name":"Kokia Blazehoof","slug":"kokia-blazehoof"},{"description":"Kyrakka and Erkhart roam the skies above the Ruby Life Pools coordinating attacks on the shrine below, while also taking out any interfering dragons. If left unchecked, they will burn the Life Pools to the ground and blow the remaining ash away in a cleansing elemental storm.","id":2503,"location":"Ruby Life Pools","name":"Kyrakka and Erkhart Stormvein","slug":"kyrakka-and-erkhart-stormvein"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"As the ancestral nesting grounds for the five flights, the Ruby Life Pools is a sacred place. The Red Dragonflight, whose charge it is to nuture all life, protect these pools and the the future of all dragonkind held within them.\r\n\r\nHowever, Raszageth and her Primalists have come to steal that future away and infuse their own powers into the sacred pools. They must be stopped for dragonkind to thrive.","expansion":"Dragonflight","id":1202,"levelMin":1,"location":"The Waking Shores","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Ruby Life Pools","slug":"ruby-life-pools","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/ruby-life-pools/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-large.jpg"},"bossEncounters":[{"description":"A pair of powerful sethrak that are blessed by the storm and charged with guarding the temple's entrance.","id":2142,"location":"Temple of Sethraliss","name":"Adderis and Aspix","slug":"adderis-and-aspix"},{"description":"Merektha is the product of foul experiments to produce an army of unstoppable beasts. With her clutch of eggs beginning to hatch, this mother is on the hunt for victims to serve as food for her ravenous children.","id":2143,"location":"Temple of Sethraliss","name":"Merektha","slug":"merektha"},{"description":"With the corruption of her temple, Sethraliss' command of lightning has created twisted elementals that roam the sunken chambers. Formed by this aberrant energy, Galvazzt seeks to grow in power by any means.","id":2144,"location":"Temple of Sethraliss","name":"Galvazzt","slug":"galvazzt"},{"description":"The Heart of Sethraliss is in the grips of a terrible power that seeks to corrupt her. Her avatar must be restored before this evil takes root and she is reborn as a dark loa capable of destroying the whole of Vol'dun.","id":2145,"location":"Temple of Sethraliss","name":"Avatar of Sethraliss","slug":"avatar-of-sethraliss"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Centuries ago, Sethraliss, a powerful snake loa, sacrificed herself to stop Mythrax from unleashing his master upon Azeroth. After the battle, her devoted followers transported her remains and built a temple around them while they awaited her rebirth. Now, a dark force stirs within this sacred temple that seeks to twist her power towards nefarious ends.","expansion":"Battle for Azeroth","id":1030,"levelMin":1,"location":"Vol'dun","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Temple of Sethraliss","slug":"temple-of-sethraliss","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/temple-of-sethraliss/details.frag"}}]}},"supportedArmoryTabs":["character","achievements","collections","uncollected","battlepets","dungeons","raids","pvp","ratings","reputation"]};

1","id":"voidscar-arena-mythic-dungeon"},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-large.jpg"},"bossEncounters":[{"description":"This ravenous hydra has survived this cursed place through scavenging the meat of the fallen. That doesn't mean it is not a fearsome combatant, eager to add some fresh temple explorers to its otherwise rotting diet.","id":2878,"location":"Altar of Fangs","name":"Rav'i","slug":"ravi"},{"description":"In the feeding frenzy upon each other, there has been one Child of Ula'tek that has proved victorious over the rest of the brood. With every battle won, the twisting monstrosity known as the Writhing Coil only grows stronger.","id":2879,"location":"Altar of Fangs","name":"The Writhing Coil","slug":"the-writhing-coil"},{"description":"With the Fang of Ula'tek, Zul'jan performs the final ritual to gain the power to release the monstrous weapon his ancestors sealed away thousands of years ago. Still held in the sway of the spirit of Malacrass, Zul'jan is unaware that the Fang is also the only hope for his sister Zul'jarra's survival.","id":2880,"location":"Altar of Fangs","name":"Zul'jan","slug":"zuljan"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Upon the Altar of Fangs, the ancient Amani sealed the vaults of Atal'Utek with the Fang of Ula'tek. Only that cursed dagger has the power to unseal the prison of the great weapon of the Amani. Aid Orweyna and Liadrin in their pursuit of Zul'jan, who has entered this accursed place in a misbegotten attempt to bring lost glory back to the Amani.","expansion":"Midnight","id":1322,"levelMin":1,"location":"Vaults of Atal'Utek","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Altar of Fangs","slug":"altar-of-fangs","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/altar-of-fangs-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/altar-of-fangs/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-large.jpg"},"bossEncounters":[{"description":"Although an accomplished Magister, Kystia Manaheart was far too devoted to fel magic to give it up entirely. Little wonder she's become a staunch supporter and ally to underground fel smuggling operations in the Row.","id":2679,"location":"Murder Row","name":"Kystia Manaheart","slug":"kystia-manaheart"},{"description":"Clever, quick-witted and commanding, Zaen Bladesorrow oversees the shipments of illegal fel artifacts. Those under his command follow his orders to the letter... or pay the price.","id":2680,"location":"Murder Row","name":"Zaen Bladesorrow","slug":"zaen-bladesorrow"},{"description":"Xathuux the Annihilator is one of Lithiel Cinderfury's most powerful summons. Although he loathes serving the warlock, he follows her commands for the sheer visceral joy of destruction.","id":2681,"location":"Murder Row","name":"Xathuux the Annihilator","slug":"xathuux-the-annihilator"},{"description":"Lithiel Cinderfury sees the Voidstorm above Silvermoon as both threat and opportunity. Her people are afraid, and she has a perfect solution... the power of fel. She claims her smuggling operation protects her people from the dangers above, but the profits she receives are a pleasing bonus.","id":2682,"location":"Murder Row","name":"Lithiel Cinderfury","slug":"lithiel-cinderfury"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The darkened streets of Murder Row hide a secret fel-smuggling operation that has been preying on the fears of Silvermoon's citizens ever since the Voidstorm appeared.","expansion":"Midnight","id":1304,"levelMin":1,"location":"Silvermoon City","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Murder Row","slug":"murder-row","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/murder-row-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/murder-row/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-large.jpg"},"bossEncounters":[{"description":"Driven by voracious greed, the gluttonous Hoardmonger fiercely defends the stashes of food and supplies he has stolen from nearby troll tribes. Nalorakk's first trial is to eliminate him before the tribes go hungry.","id":2776,"location":"Den of Nalorakk","name":"The Hoardmonger","slug":"the-hoardmonger"},{"description":"The seasons can be kind or cruel. Sentinel of Winter unleashes the harshest of winter storms to test all who face him. To surpass Nalorakk's second trial, endure the biting cold and defeat the embodiment of a winter storm.","id":2777,"location":"Den of Nalorakk","name":"Sentinel of Winter","slug":"sentinel-of-winter"},{"description":"Slumbering in his fitful and battle-filled dream, Nalorakk, the Loa of War, will only test the mettle of the worthy. Survive his trial and receive his blessing or die trying.","id":2778,"location":"Den of Nalorakk","name":"Nalorakk","slug":"nalorakk"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Wounded by Zul'jin and Malacrass, Nalorakk turned his back on the Amani, slumbering in his den to ease his pain. Now, the Amani seek to heal the rift between their tribe and the loa. But, to gain Nalorakk's favor, those who come before him must complete his trials. Assist Zul'jarra as she journeys into the mind of the Loa of War to defeat him and gain his blessing.","expansion":"Midnight","id":1311,"levelMin":1,"location":"Zul'Aman","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Den of Nalorakk","slug":"den-of-nalorakk","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/den-of-nalorakk-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/den-of-nalorakk/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-large.jpg"},"bossEncounters":[{"description":"The Lightbloom has suffered a terrible defeat, but like the rutaani it imbues, it changes. These Lightblossomed rutaani fanatically propagate their vicious and invasive garden.","id":2769,"location":"The Blinding Vale","name":"Lightblossom Trinity","slug":"lightblossom-trinity"},{"description":"Ikuzz is a fearsome carnivore who once stalked prey throughout Harandar. Now the Light Hunter has succumbed to the overwhelming power of the Lightbloom, and his insatiable hunger serves its growth.","id":2770,"location":"The Blinding Vale","name":"Ikuzz the Light Hunter","slug":"ikuzz-the-light-hunter"},{"description":"The once-respected Rootwarden Ruia could not defeat the Lightbloom on his own. His wounded pride led him to drawing power from the Lightbloom and using it to punish all others instead of aiding his allies.","id":2771,"location":"The Blinding Vale","name":"Lightwarden Ruia","slug":"lightwarden-ruia"},{"description":"Born from the Lightbloom's epicenter, Ziekket was spawned and incubated by Light-infested rutaani to create an unstoppable engine of the Lightbloom's expansion.","id":2772,"location":"The Blinding Vale","name":"Ziekket","slug":"ziekket"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"The Blinding Vale sprouted instantly. From within the Lightbloom, rutaani emerged and spread the Lightbloom in their wake.\r\nAfter the Lightbloom's defeat in Eversong, Orweyna began surgical strikes to keep the Lightbloom in check. But the hideous glare of the Blinding Vale hides a garden where the Lightbloom cultivates new creatures and magic to drive forward their one fanatical imperative. Growth unstoppable.","expansion":"Midnight","id":1309,"levelMin":1,"location":"Harandar","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"The Blinding Vale","slug":"the-blinding-vale","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/the-blinding-vale-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/the-blinding-vale/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-large.jpg"},"bossEncounters":[{"description":"Melidrussa Chillworn leads the Primalist infusion efforts in the Ruby Life Pools. Her fervent belief is that she is protecting young dragon eggs from the influence of the titans and cleansing them from the stain of Order magic. She will stop at nothing to fulfill her calling and return the eggs to what she believes is their natural state.","id":2488,"location":"Ruby Life Pools","name":"Melidrussa Chillworn","slug":"melidrussa-chillworn"},{"description":"As Primalist forces assault the Ruby Life Pools from all sides, it falls to Kokia and her Blazebound lieutenants to capture precious eggs from overwhelmed defenders, all while spreading flame and havoc as they go.","id":2485,"location":"Ruby Life Pools","name":"Kokia Blazehoof","slug":"kokia-blazehoof"},{"description":"Kyrakka and Erkhart roam the skies above the Ruby Life Pools coordinating attacks on the shrine below, while also taking out any interfering dragons. If left unchecked, they will burn the Life Pools to the ground and blow the remaining ash away in a cleansing elemental storm.","id":2503,"location":"Ruby Life Pools","name":"Kyrakka and Erkhart Stormvein","slug":"kyrakka-and-erkhart-stormvein"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"As the ancestral nesting grounds for the five flights, the Ruby Life Pools is a sacred place. The Red Dragonflight, whose charge it is to nuture all life, protect these pools and the the future of all dragonkind held within them.\r\n\r\nHowever, Raszageth and her Primalists have come to steal that future away and infuse their own powers into the sacred pools. They must be stopped for dragonkind to thrive.","expansion":"Dragonflight","id":1202,"levelMin":1,"location":"The Waking Shores","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Ruby Life Pools","slug":"ruby-life-pools","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/ruby-life-pools-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/ruby-life-pools/details.frag"}},{"dungeon":{"background":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-large.jpg"},"bossEncounters":[{"description":"A pair of powerful sethrak that are blessed by the storm and charged with guarding the temple's entrance.","id":2142,"location":"Temple of Sethraliss","name":"Adderis and Aspix","slug":"adderis-and-aspix"},{"description":"Merektha is the product of foul experiments to produce an army of unstoppable beasts. With her clutch of eggs beginning to hatch, this mother is on the hunt for victims to serve as food for her ravenous children.","id":2143,"location":"Temple of Sethraliss","name":"Merektha","slug":"merektha"},{"description":"With the corruption of her temple, Sethraliss' command of lightning has created twisted elementals that roam the sunken chambers. Formed by this aberrant energy, Galvazzt seeks to grow in power by any means.","id":2144,"location":"Temple of Sethraliss","name":"Galvazzt","slug":"galvazzt"},{"description":"The Heart of Sethraliss is in the grips of a terrible power that seeks to corrupt her. Her avatar must be restored before this evil takes root and she is reborn as a dark loa capable of destroying the whole of Vol'dun.","id":2145,"location":"Temple of Sethraliss","name":"Avatar of Sethraliss","slug":"avatar-of-sethraliss"}],"category":{"id":0,"name":"Dungeon","enum":"DUNGEON","slug":"dungeon"},"description":"Centuries ago, Sethraliss, a powerful snake loa, sacrificed herself to stop Mythrax from unleashing his master upon Azeroth. After the battle, her devoted followers transported her remains and built a temple around them while they awaited her rebirth. Now, a dark force stirs within this sacred temple that seeks to twist her power towards nefarious ends.","expansion":"Battle for Azeroth","id":1030,"levelMin":1,"location":"Vol'dun","modes":["NORMAL","HEROIC","MYTHIC","MYTHIC_KEYSTONE"],"name":"Temple of Sethraliss","slug":"temple-of-sethraliss","thumbnail":{"url":"https://render.worldofwarcraft.com/us/zones/temple-of-sethraliss-small.jpg"},"url":"/character/us/hyjal/greet/pve/mythic/temple-of-sethraliss/details.frag"}}]}},"supportedArmoryTabs":["character","achievements","collections","uncollected","battlepets","dungeons","raids","pvp","ratings","reputation"]},"variableName":"characterProfileInitialState"}]};</script><script id="settings">settings = {"x-powered-by":false,"etag":"weak","env":"production","query parser":"extended","subdomain offset":2,"trust proxy":true,"views":"/usr/src/app/templates","jsonp callback name":"callback","view cache":true,"view engine":"pug"};</script></body></html>
